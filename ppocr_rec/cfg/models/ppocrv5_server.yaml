# PP-OCRv5 server: PPHGNetV2_B4 + MultiHead (CTC + NRTR)

algorithm: SVTR_HGNet
imgsz: [48, 320]
loss: MultiLoss

Architecture:
  model_type: rec
  algorithm: SVTR_HGNet
  Transform:
  Backbone:
    name: PPHGNetV2_B4
    text_rec: true
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: true
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: 25

aug:
  type: rec
  con_aug: false
  multi_scale: [[320, 32], [320, 48], [320, 64]]
